[package]
name = "donut"
version = "1.0.0"
edition = "2021"
authors = ["saravenpi"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
